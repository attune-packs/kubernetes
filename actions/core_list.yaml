ref: kubernetes.core_list
label: "List Services Or ConfigMaps"
description: "List v1 Services or ConfigMaps in one namespace with pagination"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: kubernetes_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: pack.kubernetes.credentials, required: true}
  kind: {type: string, enum: [Service, ConfigMap], required: true}
  namespace: {type: string}
  label_selector: {type: string}
  field_selector: {type: string}
  limit: {type: integer, minimum: 1, maximum: 500, default: 100}
  continue_token: {type: string}
  request_timeout_seconds: {type: integer, minimum: 1, maximum: 300, default: 30}
  max_output_bytes: {type: integer, minimum: 1024, maximum: 4194304, default: 1048576}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [kubernetes, service, configmap, list, read]
