ref: kubernetes.generic_list
label: "Safe Generic List"
description: "List resources only for an exact discovered non-secret GA allowlist entry"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: kubernetes_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: pack.kubernetes.credentials, required: true}
  api_version: {type: string, enum: [apps/v1, autoscaling/v2, networking.k8s.io/v1, policy/v1, storage.k8s.io/v1], required: true}
  kind: {type: string, enum: [ReplicaSet, HorizontalPodAutoscaler, Ingress, NetworkPolicy, PodDisruptionBudget, StorageClass], required: true}
  namespace: {type: string}
  label_selector: {type: string}
  field_selector: {type: string}
  limit: {type: integer, minimum: 1, maximum: 500, default: 100}
  continue_token: {type: string}
  request_timeout_seconds: {type: integer, minimum: 1, maximum: 300, default: 30}
  max_output_bytes: {type: integer, minimum: 1024, maximum: 4194304, default: 1048576}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [kubernetes, generic, allowlisted, list, read]
