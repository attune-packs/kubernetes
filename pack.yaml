ref: kubernetes
label: "Kubernetes"
description: "Curated, discovery-backed Kubernetes operations with Attune Key credentials and safe defaults"
version: "0.1.0"
author: "Attune; adapted from work by Andrew Moore, Michael Ward, and StackStorm Exchange contributors"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: integration
  documentation_url: "https://kubernetes.io/docs/reference/using-api/"
  repository_url: "https://github.com/attune-packs/kubernetes"
  source_revision: "d6a52dbf72de7d3e034914299d3ac670d0532c38"
  source_version: "1.0.1"
  client_version: "36.0.3"
  license: "Apache-2.0"

tags: [kubernetes, containers, orchestration, integration]
runtime_deps: [python]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
